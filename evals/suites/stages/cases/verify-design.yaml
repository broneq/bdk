# Cases of /bdk:verify-design (spec stage-skills, verify-design requirement).
# Every case starts from a fresh copy of the pinned fixture on its branch
# feat/eval with Lavish off. The design files are written and marked done in
# prepare, so only the verifier round is under test; the clean design states
# only what the fixture holds (formatTimestamp in src/ui/format.ts and its
# tests), and the false claim names a module the fixture lacks.
- id: clean
  command: /bdk:verify-design
  prepare:
    - |-
      bdk config set tools.test.vitest '{tier: fast, command: npm test}' >/dev/null
    - |-
      bdk config set tools.lint none >/dev/null
    - |-
      bdk config set features.lavish false >/dev/null
    - |-
      git add -A && git commit -qm "bdk settings"
    - |-
      bdk change new "Add a date-only formatter next to formatTimestamp" >/dev/null
    - |-
      D=$(ls -d .bdk/changes/20*) && cat > "$D/design.md" <<'MD'
      ---
      schema: 1
      title: A date-only formatter
      architecture: false
      ---
      # A date-only formatter

      `src/ui/format.ts` exports `formatTimestamp(value, fallback = 'Unknown')`,
      which formats a parseable ISO string with a module-level
      `Intl.DateTimeFormat` (`dateStyle: 'medium'`, `timeStyle: 'short'`),
      returns `fallback` for a missing or empty value, and returns an
      unparseable value verbatim. `src/ui/format.test.ts` covers those three
      paths and builds its expected text with the same `Intl` options, so it
      holds on any host locale.

      Add `formatDate(value, fallback = 'Unknown')` to `src/ui/format.ts`, with
      its own module-level formatter using `dateStyle: 'medium'` only and the
      same rules for missing and unparseable values. Add its cases to
      `src/ui/format.test.ts` in the same locale-independent form. No existing
      caller changes, and `formatTimestamp` keeps its behaviour.

      ## Not decided

      Which screens switch from `formatTimestamp` to `formatDate` is left to
      later Changes; this Change only adds the helper.
      MD
    - |-
      bdk done design >/dev/null
  expect:
    - run: explain design-verify
      json:
        state: done
    - run: log list --type report --for design-verify
      json:
        total: 1

- id: false-claim
  command: /bdk:verify-design
  prepare:
    - |-
      bdk config set tools.test.vitest '{tier: fast, command: npm test}' >/dev/null
    - |-
      bdk config set tools.lint none >/dev/null
    - |-
      bdk config set features.lavish false >/dev/null
    - |-
      git add -A && git commit -qm "bdk settings"
    - |-
      bdk change new "Add Italian to the language options of the account page" >/dev/null
    - |-
      D=$(ls -d .bdk/changes/20*) && cat > "$D/design.md" <<'MD'
      ---
      schema: 1
      title: Italian in the account language options
      ---
      # Italian in the account language options

      The offered languages come from the `LocaleRegistry` class in
      `src/i18n/localeRegistry.ts`, which loads them from the backend at start.
      Register Italian there with `LocaleRegistry.register('it', 'Italian')`.
      No other module changes.
      MD
    - |-
      D=$(ls -d .bdk/changes/20*) && cat > "$D/architecture.md" <<'MD'
      ---
      schema: 1
      title: Architecture of the Italian language option
      ---
      # Architecture

      `src/i18n/localeRegistry.ts` owns the offered languages; no boundary moves.
      MD
    - |-
      bdk done design >/dev/null && bdk done architecture >/dev/null
  expect:
    - run: log list --type blocker
      json:
        items.0.category: false-code-claim
      match:
        items.0.status: "^(proposed|accepted)$"
    - run: explain design-verify
      match:
        state: "^(ready|blocked)$"

- id: not-ready
  command: /bdk:verify-design
  prepare:
    - |-
      bdk config set tools.test.vitest '{tier: fast, command: npm test}' >/dev/null
    - |-
      bdk config set tools.lint none >/dev/null
    - |-
      bdk config set features.lavish false >/dev/null
    - |-
      git add -A && git commit -qm "bdk settings"
    - |-
      bdk change new "Add Italian to the language options of the account page" >/dev/null
  expect:
    - run: attempt list
      json:
        total: 0
    - reply: /bdk:design
