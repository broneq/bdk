# Cases of /bdk:plan (spec stage-skills, plan requirements). Every case starts
# from a fresh copy of the pinned fixture on its branch feat/eval with Lavish
# off. Without an active Change the prompt-expansion guard blocks /bdk:plan
# before the skill runs (kernel hook tests cover it), so no case starts there.
# The bug Change has no design stage, so the skill plans it from the
# intent and the code: formatTimestamp in src/ui/format.ts returns a
# whitespace-only value verbatim, since only an empty value takes the fallback.
- id: bug
  command: /bdk:plan
  prepare:
    - |-
      node "$BDK" config set tools.test.vitest '{tier: fast, command: npm test}' >/dev/null
    - |-
      node "$BDK" config set tools.lint none >/dev/null
    - |-
      node "$BDK" config set features.lavish false >/dev/null
    - |-
      git add -A && git commit -qm "bdk settings"
    - |-
      node "$BDK" change new "formatTimestamp in src/ui/format.ts returns a whitespace-only value verbatim instead of the fallback" --kind bug >/dev/null
  expect:
    - run: explain plan
      json:
        state: done
    - run: explain plan-verify
      json:
        state: done
    # A one-function fix is one part (the intent sets the size of the plan).
    - run: part list
      json:
        total: 1
      match:
        items.0.part: "^01$"
    # The command, not prose: the reply may be in any language.
    - reply: /bdk:execute

# A defect in a shared module: parseApiProblem in src/api/http.ts takes any
# JSON body for problem details, so a 5xx whose body is a gateway's JSON is an
# ApiRequestError, never retried and never shown as backend-unavailable. Nine
# API modules and the debug logging read through it; the plan stays one part
# and leaves the pages alone.
- id: shared-bug
  command: /bdk:plan
  prepare:
    - |-
      node "$BDK" config set tools.test.vitest '{tier: fast, command: npm test}' >/dev/null
    - |-
      node "$BDK" config set tools.lint none >/dev/null
    - |-
      node "$BDK" config set features.lavish false >/dev/null
    - |-
      git add -A && git commit -qm "bdk settings"
    - |-
      node "$BDK" change new "A 5xx response whose JSON body is not problem details, such as a gateway's {\"error\":\"upstream timeout\"}, is treated as an API error: GET reads are not retried and pages show a generic failure instead of the backend-unavailable message" --kind bug >/dev/null
  expect:
    - run: explain plan
      json:
        state: done
    - run: explain plan-verify
      json:
        state: done
    - run: part list
      json:
        total: 1
    - reply: /bdk:execute
