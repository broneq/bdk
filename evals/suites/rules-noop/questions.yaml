# M1 knowledge test (design D-8): one question per rule bullet. A model answers
# blind, without the rules; the judge compares the answer with the bullet. A
# question asks for what the bullet says without quoting it: no run of six
# words is shared with the bullet (checked by questions.test.ts). A changed
# bullet gets a new id, so its question must be reviewed again.
