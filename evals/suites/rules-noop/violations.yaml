not-seedable:
  - bullet: code-quality.09.41d89cfb
    reason: the fixture has no async pipeline across process or time boundaries (queue, worker, webhook chain)
  - bullet: code-quality.10.5476143b
    reason: a note about the rule file itself, not a rule for code
  - bullet: security.10.f3eef68b
    reason: a note about the rule file itself, not a rule for code
  - bullet: design-patterns.13.47ca8808
    reason: governs how a reviewer proposes a pattern, not the code under review
  - bullet: design-patterns.14.a9368ad8
    reason: points to the pattern catalog; it states no rule a diff can break
  - bullet: engineering-judgment.01.1c143231
    reason: governs how approaches are compared, not code
  - bullet: engineering-judgment.02.56e82a4b
    reason: governs the reviewer's own behaviour, not code
  - bullet: test-quality.13.4340d869
    reason: a permission ("still allowed"), not a prohibition; a diff cannot violate it
  - bullet: test-quality.14.000e5dd1
    reason: a permission ("still allowed"), not a prohibition; a diff cannot violate it
  - bullet: test-quality.15.67efa34a
    reason: a permission ("still allowed"), not a prohibition; a diff cannot violate it
  - bullet: test-quality.16.5e2bb8be
    reason: a permission ("still allowed"), not a prohibition; a diff cannot violate it
  - bullet: test-quality.17.b8a39a39
    reason: governs what the author declares about testing, which a diff does not carry
  - bullet: languages/react.01.7f1e2abd
    reason: needs Server Components; the fixture is a client-only Vite SPA
  - bullet: languages/react.16.bade8d1b
    reason: needs a mutation with useOptimistic under a Suspense boundary; the fixture has neither, so the seeded case would stand alone
  - bullet: languages/react.17.6e3551fc
    reason: needs Server Actions; the fixture is a client-only Vite SPA
  - bullet: languages/react.19.9766037e
    reason: ViewTransition is not in the fixture's stable React 19.2
  - bullet: languages/react.20.0477adec
    reason: preload and preinit pay off with server rendering; the fixture is a client-only Vite SPA
  - bullet: languages/react.23.774e0d8f
    reason: needs Server Components and Server Actions; the fixture is a client-only Vite SPA
  - bullet: languages/typescript.02.f372a9a8
    reason: asks to turn checks on that the fixture's base config already leaves off; a diff can only keep them off, which is no change to review
  - bullet: languages/typescript.20.fba20d9c
    reason: needs a third-party declaration file that lies about runtime shape; a diff cannot show that without the library's runtime
  - bullet: languages/typescript.22.dbd6f1d7
    reason: asks for a compiler flag the fixture's base config does not set; a diff can only keep it unset, which is no change to review
