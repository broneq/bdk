# Task file for `pnpm eval with-without --skill bdk-craft:debugging` on the default
# fixture. Each prompt hands over a buggy helper that is not in the repository
# yet and a user's bug report. The assertions see only the final reply, so every
# prompt asks for a summary at the end. They check what the skill changes: a
# reproduction that was seen failing before the fix, more than one candidate cause
# weighed, the cause named, a regression test kept, and a search for the same
# pattern elsewhere.
- id: date-filter
  prompt: >-
    Save this helper as src/utils/dateFilter.ts:
    `export function onDay(items: { at: string }[], day: string) { const start = new Date(day); const end = new Date(start.getTime() + 86400000); return items.filter((i) => { const t = new Date(i.at); return t >= start && t < end; }); }`.
    Users in New York report that filtering for 2026-03-01 shows entries from the
    evening of February 28 and misses late entries of March 1; users in Warsaw
    see the opposite at the start of the day. Find the cause and fix it. End your
    reply with a short summary of what you found and did.
  assert:
    - type: javascript
      value: >-
        /\b(failed|failing|fails)\b[^.\n]*\bbefore\b|\bbefore\b[^.\n]*\b(failed|failing|fails)\b|\b(red|reproduc\w*)\b[^.\n]*\b(failed|failing|fails)\b/i.test(String(output))
    - type: javascript
      value: >-
        /UTC/.test(String(output))
    - type: javascript
      value: >-
        /(hypothes|candidate cause|possible cause|ruled out|dropped)/i.test(String(output))
    - type: javascript
      value: >-
        /(same pattern|elsewhere|other (places|call(er)?s|uses)|searched|grep)/i.test(String(output))
- id: vat-rounding
  prompt: >-
    Save this as src/utils/vat.ts:
    `export const gross = (net: number, rate = 0.23) => Math.round(net * (1 + rate) * 100) / 100; export const total = (lines: { net: number; qty: number }[]) => lines.reduce((s, l) => s + gross(l.net) * l.qty, 0);`.
    Accounting says some invoices are off by one cent against their own
    spreadsheet, for example three lines of 10.05 net. Find the real cause and fix
    it so it cannot come back. Close your reply with a summary of the cause, the fix
    and the test that guards it.
  assert:
    - type: javascript
      value: >-
        /\b(failed|failing|fails)\b[^.\n]*\bbefore\b|\bbefore\b[^.\n]*\b(failed|failing|fails)\b|\b(red|reproduc\w*)\b[^.\n]*\b(failed|failing|fails)\b/i.test(String(output))
    - type: javascript
      value: >-
        /(minor units|integer cents|in cents|floating[- ]point|binary float)/i.test(String(output))
    - type: javascript
      value: >-
        /(hypothes|candidate cause|possible cause|ruled out|dropped)/i.test(String(output))
    - type: javascript
      value: >-
        /(regression test|guards? (it|against)|keeps? (it|the bug) from)/i.test(String(output))
- id: page-slice
  prompt: >-
    Save this as src/utils/paginate.ts:
    `export function page<T>(items: T[], n: number, size = 20) { const from = (n - 1) * size; return { items: items.slice(from, from + size - 1), hasMore: from + size <= items.length }; }`.
    A user says the catalog sometimes skips a product between pages and the last
    page is sometimes empty. Track it down and fix it. End your reply with a
    summary of what was wrong, how you proved it and what you changed.
  assert:
    - type: javascript
      value: >-
        /\b(failed|failing|fails)\b[^.\n]*\bbefore\b|\bbefore\b[^.\n]*\b(failed|failing|fails)\b|\b(red|reproduc\w*)\b[^.\n]*\b(failed|failing|fails)\b/i.test(String(output))
    - type: javascript
      value: >-
        /(hypothes|candidate cause|possible cause|ruled out|dropped)/i.test(String(output))
    - type: javascript
      value: >-
        /hasMore/.test(String(output)) && /slice/.test(String(output))
    - type: javascript
      value: >-
        /(same pattern|elsewhere|other (places|call(er)?s|uses)|searched|grep)/i.test(String(output))
