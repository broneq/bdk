# Example task file for `pnpm eval with-without --skill bdk:mermaid-drawer`.
# Each prompt asks for a diagram in plain words, so the skill is picked by the
# model in the "with" cell and simply absent in the "without" cell. The
# assertions check what the skill fixes: the diagram type chosen by the
# relationship, labelled edges, and colour that sets fill, stroke and text
# colour together, so it stays readable in dark mode.
- id: login-sequence
  prompt: >-
    Draw a diagram of how our single-page app logs a user in: the browser posts the
    credentials to POST /api/auth/login, the API checks them against the user store,
    and the API answers either with a session cookie or with 401. Reply with the
    diagram only.
  assert:
    - type: javascript
      value: "/```mermaid\\s*\\n\\s*sequenceDiagram/.test(String(output))"
    - type: javascript
      value: "/401/.test(String(output))"
- id: order-lifecycle
  prompt: >-
    Draw a diagram of the life of an order in our shop: it is created as a draft,
    placed, then paid or cancelled; a paid order is shipped and then delivered, and
    a shipped order can be returned. Reply with the diagram only.
  assert:
    - type: javascript
      value: "/```mermaid\\s*\\n\\s*stateDiagram-v2/.test(String(output))"
    - type: javascript
      value: "/\\[\\*\\]/.test(String(output))"
- id: service-map
  prompt: >-
    Draw a diagram of our system: a web app and a mobile app call an API gateway;
    the gateway routes to an orders service and a users service; the orders service
    writes to Postgres and publishes to a Kafka topic that a billing worker reads.
    Reply with the diagram only.
  assert:
    - type: javascript
      value: "/```mermaid\\s*\\n\\s*flowchart/.test(String(output))"
    - type: javascript
      value: >-
        String(output).split("\n").filter((line) => /^\s*(classDef|style)\s.*fill:/.test(line))
        .every((line) => /stroke:/.test(line) && /[\s,]color:/.test(line))
    - type: javascript
      value: "/-->\\|[^|]+\\||--\\s[^-]+\\s-->/.test(String(output))"
