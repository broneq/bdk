name: docs

# The documentation site (capability `docs-site`): a strict build on every
# pull request and push, a deploy to GitHub Pages only from main. main
# carries no site config before the 3.0 release, so the first deploy is the
# 3.0 release; the repository's Pages source must be "GitHub Actions" by then.
on:
  push:
    branches:
      - main
      - staging/v3
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A dead link fails the build; the anchor guard runs in the kernel
      # job's contract step.
      - name: Build the site strictly
        run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/guide/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
