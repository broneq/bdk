name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git
        # bdk_run_state.py's tests build throwaway repos and commit in them,
        # which needs an identity the runner does not ship with.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run unit tests
        run: uv run pytest tests/unit/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CLI contract tests
        # Consistency of docs/CLI-CONTRACT.md with schema/cli/ (T10). T11 moves
        # this into the kernel's own test harness.
        run: node --test tests/contract/*.test.mjs
