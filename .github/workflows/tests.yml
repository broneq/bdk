name: tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The release workflow builds on the same line, so the determinism
      # check covers the build it publishes.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Git tracks no generated file (kernel-architecture, Generated outputs),
      # so there is no copy to compare with. The release job publishes a build
      # of the tag, so a second build must reproduce the first byte for byte.
      - name: Build is deterministic
        run: |
          sums() { find dist schema agents -type f -print0 | sort -z | xargs -0 sha256sum; }
          sums > "$RUNNER_TEMP/before"
          pnpm build
          sums > "$RUNNER_TEMP/after"
          diff "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code and dependencies
        run: pnpm knip

  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum (HOST-FACTS node-sqlite-min), the active LTS and the
        # current release; every line runs the same steps. Only steps that
        # execute kernel code run here; checks whose result depends only on the
        # source and the lockfile run once in the static job
        # (kernel-architecture, Continuous integration).
        node: ["22.13", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests with coverage
        run: pnpm test:unit

      - name: E2E tests
        run: pnpm test:e2e

      # The OpenSpec compatibility contract test (T30-D14) validates the
      # merged .bdk/specs/ with the version CLAUDE.md pins; it fails in CI
      # when openspec is missing.
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.2

      - name: Contract and structural tests
        run: pnpm test:contract

  lint-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint reads every commit of the pull request.
          fetch-depth: 0

      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - uses: pnpm/action-setup@v6
        if: github.event_name == 'pull_request'

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

  skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The config and the BDK rule plugin are TypeScript, which needs type
      # stripping (Node >= 22.18); .nvmrc pins a line that has it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Skill content check
        run: pnpm skill-check

  eval-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The harness entry point is TypeScript run by Node's type stripping
      # (Node >= 22.18); .nvmrc pins a line that has it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Renders every suite's promptfoo config and validates it with the
      # pinned promptfoo (installed into evals/node_modules on first use).
      # No credentials and no model call: measured runs are local only.
      - name: Eval configs render and validate
        run: pnpm eval check
