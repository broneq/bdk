# Dependency updates (design D-10 of v3-t11-kernel-skeleton): one grouped pull
# request per ecosystem per month. Versions stay exact in package.json.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
