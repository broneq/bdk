name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines minimum (type stripping on by default), the active LTS
        # and the current release.
        node: ["22.18", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Committed bundles are up to date
        run: git diff --exit-code dist/

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code and dependencies
        run: pnpm knip

      - name: Unit, CLI and fixture tests with coverage
        run: pnpm test

      - name: The kit's own skills pass the portable profile
        run: pnpm self-check

  lint-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint reads every commit of the pull request.
          fetch-depth: 0

      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - uses: pnpm/action-setup@v6
        if: github.event_name == 'pull_request'

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
